<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站统计 - tonidaozai.github.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 900px;
      width: 90%;
    }
    .login { text-align: center; }
    .login h2 { margin-bottom: 20px; color: #333; }
    .login input {
      padding: 12px 20px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      width: 200px;
      margin-right: 10px;
    }
    .login button {
      padding: 12px 30px;
      font-size: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .login button:hover { background: #764ba2; transform: translateY(-2px); }
    .error { color: #e74c3c; margin-top: 15px; font-size: 14px; }
    
    .stats { display: none; }
    .stats h1 { color: #333; margin-bottom: 10px; }
    .stats .url { color: #666; margin-bottom: 30px; font-size: 14px; }
    .count-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 30px;
    }
    .count-box .number { font-size: 60px; font-weight: bold; }
    .count-box .label { font-size: 18px; opacity: 0.9; margin-top: 5px; }
    
    .ip-section h3 { color: #333; margin-bottom: 15px; }
    .ip-list {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .ip-item {
      padding: 12px 15px;
      border-bottom: 1px solid #e0e0e0;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 15px;
      align-items: center;
      font-size: 14px;
    }
    .ip-item:last-child { border-bottom: none; }
    .ip-item .time { color: #888; font-size: 12px; }
    .ip-item .ip { color: #333; font-weight: 500; }
    .ip-item .country {
      background: #667eea;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .ip-item .country.unknown {
      background: #aaa;
    }
    
    .loading { text-align: center; color: #666; padding: 20px; }

    /* Video stats styles */
    .video-section { margin-top: 30px; }
    .video-section h3 { color: #333; margin-bottom: 15px; }
    .video-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .video-stat-box {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .video-stat-box .number { font-size: 32px; font-weight: bold; }
    .video-stat-box .label { font-size: 14px; opacity: 0.9; margin-top: 5px; }
    
    .video-list {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #f9f9f9;
      overflow: hidden;
    }
    .video-item {
      padding: 15px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: grid;
      grid-template-columns: 1fr repeat(3, auto);
      gap: 20px;
      align-items: center;
    }
    .video-item:last-child { border-bottom: none; }
    .video-item .name { font-weight: 600; color: #333; }
    .video-item .stat { text-align: center; }
    .video-item .stat .num { font-size: 20px; font-weight: bold; color: #667eea; }
    .video-item .stat .txt { font-size: 12px; color: #888; }
    .video-item .stat.completed .num { color: #27ae60; }
    
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="login" id="login">
      <h2>🔒 请输入密码查看统计</h2>
      <div>
        <input type="password" id="password" placeholder="密码" autofocus>
        <button onclick="checkPassword()">进入</button>
      </div>
      <p class="error" id="error"></p>
    </div>

    <div class="stats" id="stats">
      <h1>📊 网站统计</h1>
      <p class="url">https://tonidaozai.github.io/</p>
      
      <div class="count-box">
        <div class="number" id="count">-</div>
        <div class="label">总访问次数</div>
      </div>

      <!-- Video Stats Section -->
      <div class="video-section" id="videoSection" style="display:none;">
        <h3>🎬 视频观看统计</h3>
        <div class="video-summary">
          <div class="video-stat-box">
            <div class="number" id="totalPlays">0</div>
            <div class="label">总播放次数</div>
          </div>
          <div class="video-stat-box">
            <div class="number" id="totalWatchTime">0</div>
            <div class="label">总观看时长(秒)</div>
          </div>
          <div class="video-stat-box">
            <div class="number" id="completedPlays">0</div>
            <div class="label">完整播放次数</div>
          </div>
        </div>
        
        <div class="video-list" id="videoList">
          <div class="loading">加载中...</div>
        </div>
      </div>
      
      <div class="ip-section">
        <h3>🌐 访客IP记录（最近100条）</h3>
        <div class="ip-list" id="ipList">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <a href="https://tonidaozai09.github.io/tonidaozai-stats/" class="back-link">← 刷新页面</a>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://cf-counter.541366405.workers.dev';
    const CORRECT_PASSWORD = 'Robin09';

    // 国家代码转换为国家名称（常用国家）
    const countryNames = {
      'CN': '中国', 'JP': '日本', 'US': '美国', 'KR': '韩国',
      'TW': '台湾', 'HK': '香港', 'SG': '新加坡', 'MY': '马来西亚',
      'TH': '泰国', 'VN': '越南', 'AU': '澳大利亚', 'CA': '加拿大',
      'GB': '英国', 'DE': '德国', 'FR': '法国', 'RU': '俄罗斯',
      'IN': '印度', 'BR': '巴西', 'IT': '意大利', 'ES': '西班牙',
      'NL': '荷兰', 'SE': '瑞典', 'CH': '瑞士', 'PL': '波兰',
      'unknown': '未知'
    };

    // 视频名称映射
    const videoNames = {
      'yuanmengzhixing': '元梦之星',
      'qqxiaowo': 'QQ小窝'
    };

    function checkPassword() {
      const input = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      
      if (input === CORRECT_PASSWORD) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('stats').style.display = 'block';
        loadStats();
      } else {
        errorEl.textContent = '密码错误，请重试！';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    async function loadStats() {
      try {
        const response = await fetch(`${WORKER_URL}/stats?password=${CORRECT_PASSWORD}`);
        const data = await response.json();
        
        if (response.ok) {
          // Visit count
          document.getElementById('count').textContent = data.count;
          
          // Video stats
          if (data.video && data.video.totalPlays > 0) {
            document.getElementById('videoSection').style.display = 'block';
            document.getElementById('totalPlays').textContent = data.video.totalPlays;
            document.getElementById('totalWatchTime').textContent = data.video.totalWatchTime;
            document.getElementById('completedPlays').textContent = data.video.completedPlays;
            
            const videoListEl = document.getElementById('videoList');
            videoListEl.innerHTML = '';
            
            // Header
            const header = document.createElement('div');
            header.className = 'video-item';
            header.style.background = '#f0f0f0';
            header.innerHTML = `
              <div class="name">视频</div>
              <div class="stat"><div class="num">播放次数</div><div class="txt"></div></div>
              <div class="stat"><div class="num">观看时长</div><div class="txt"></div></div>
              <div class="stat completed"><div class="num">完整播放</div><div class="txt"></div></div>
            `;
            videoListEl.appendChild(header);
            
            // Video items
            const byVideo = data.video.byVideo || {};
            for (const [videoId, stats] of Object.entries(byVideo)) {
              const div = document.createElement('div');
              div.className = 'video-item';
              
              const name = videoNames[videoId] || videoId;
              const watchTime = stats.totalWatchTime || 0;
              const watchTimeStr = watchTime >= 60 
                ? `${Math.floor(watchTime/60)}分${watchTime%60}秒` 
                : `${watchTime}秒`;
              
              div.innerHTML = `
                <div class="name">${name}</div>
                <div class="stat">
                  <div class="num">${stats.plays || 0}</div>
                  <div class="txt">次</div>
                </div>
                <div class="stat">
                  <div class="num">${watchTimeStr}</div>
                  <div class="txt"></div>
                </div>
                <div class="stat completed">
                  <div class="num">${stats.completed || 0}</div>
                  <div class="txt">次</div>
                </div>
              `;
              videoListEl.appendChild(div);
            }
          }
          
          // IP records
          const ipListEl = document.getElementById('ipList');
          ipListEl.innerHTML = '';
          
          if (data.ips.length === 0) {
            ipListEl.innerHTML = '<div class="ip-item" style="justify-content:center; color:#888;">暂无访问记录</div>';
          } else {
            data.ips.reverse().forEach(item => {
              const div = document.createElement('div');
              div.className = 'ip-item';
              
              const countryName = countryNames[item.country] || item.country;
              const countryClass = item.country === 'unknown' ? 'country unknown' : 'country';
              
              div.innerHTML = `
                <div>
                  <span class="ip">${item.ip}</span>
                </div>
                <span class="${countryClass}">${countryName}</span>
                <span class="time">${new Date(item.time).toLocaleString('zh-CN', { timeZone: 'Asia/Tokyo' })}</span>
              `;
              ipListEl.appendChild(div);
            });
          }
        } else {
          document.getElementById('ipList').innerHTML = `<div class="error">加载失败：${data.error}</div>`;
        }
      } catch (err) {
        document.getElementById('ipList').innerHTML = `<div class="error">请求失败：${err.message}</div>`;
      }
    }

    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
